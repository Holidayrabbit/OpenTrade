<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenTrade · 开源量化模型四市场回测实验</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#131722; --panel2:#1a2030; --border:#232a3b;
    --text:#d7dce6; --muted:#8a93a6; --green:#00d68f; --red:#ff5c5c;
    --blue:#4c8dff; --orange:#ffb02e; --purple:#b47aff; --gray:#8a8f98;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
  header{padding:34px 0 10px}
  h1{font-size:26px;font-weight:700;letter-spacing:.5px}
  h1 .accent{color:var(--green)}
  .subtitle{color:var(--muted);font-size:14px;margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);font-weight:600}
  h2{font-size:17px;margin:34px 0 14px;padding-left:10px;border-left:3px solid var(--green)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
  .card .label{font-size:12px;color:var(--muted)}
  .card .big{font-size:30px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .card .sub{font-size:12px;color:var(--muted)}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .chart{width:100%;height:400px}
  .chart-sm{width:100%;height:280px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:6px 18px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;font-size:14px;color:var(--muted)}
  .tab.on{color:#0b0e14;background:var(--green);border-color:var(--green);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:500}
  .method{font-size:13.5px;color:var(--text)}
  .method p{margin:8px 0;color:var(--muted)}
  .method b{color:var(--text)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .verdict{background:linear-gradient(90deg,rgba(0,214,143,.08),transparent);border:1px solid rgba(0,214,143,.25);border-radius:12px;padding:16px 18px;font-size:14px;margin-bottom:14px}
  footer{margin-top:50px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:18px}
  a{color:var(--blue);text-decoration:none}
  .holdings{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .hchip{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 10px;font-size:12px}
  #loading{text-align:center;padding:80px;color:var(--muted)}
  .err{color:var(--red)}
</style>
</head>
<body>
<div class="wrap" id="app"><div id="loading">加载实验数据中…</div></div>

<script>
const COLORS={buyhold:"#8a8f98",static:"#4c8dff",monthly:"#ffb02e",weekly:"#00d68f",gru_static:"#b47aff",linear_static:"#7fd3ff",linear_weekly:"#00b4d8",alstm_static:"#ff8fd0",ridge_static:"#ffe08a",mlp_static:"#c9a2ff",strat_base:"#9aa7ff",strat_dropout:"#6f8dff",strat_riskparity:"#4fd1c5",strat_voltarget:"#f6ad55",strat_timing:"#fc8181",strat_combo:"#ed64a6"};
const FALLBACK_PALETTE=["#63b3ed","#f687b3","#68d391","#d6bcfa","#f6e05e","#76e4f7"];
const colorOf=v=>COLORS[v]||FALLBACK_PALETTE[(v.charCodeAt(0)+v.length)%FALLBACK_PALETTE.length];
const VNAME={buyhold:"等权买入持有",static:"静态模型(年初训练一次)",monthly:"每月再训练",weekly:"每周再训练",gru_static:"GRU神经网络(GPU)",linear_static:"线性回归(基准)",linear_weekly:"线性回归·每周再训练",alstm_static:"ALSTM注意力网络(GPU)",ridge_static:"Ridge回归(L2正则)",mlp_static:"MLP前馈网络(GPU)",strat_base:"策略基线:TopK等权",strat_dropout:"TopK-Dropout(降换手)",strat_riskparity:"风险平价加权",strat_voltarget:"波动率目标20%",strat_timing:"趋势择时(30周均线)",strat_combo:"全策略叠加"};
const nameOf=(v,label)=>label||VNAME[v]||v;
const MKTNAME={cn:"A股·沪深300",us:"美股·标普500",crypto:"加密货币·币安Top15",gold:"黄金资产组合"};
const fmtPct=(x,d=1)=>x==null?"–":((x>=0?"+":"")+(x*100).toFixed(d)+"%");
const fmtNum=(x,d=2)=>x==null?"–":x.toFixed(d);
const instName=(mkt,inst)=>{const u=(UNI[mkt]||[]).find(x=>x.inst===inst);return u?`${u.name}(${inst})`:inst};
let UNI={};
const qs=new URLSearchParams(location.search);

async function jload(p){const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json()}

function kpiCard(label,ret,sub,extra){
  const cls=ret>=0?"pos":"neg";
  return `<div class="card"><div class="label">${label}</div>
    <div class="big ${cls}">${fmtPct(ret)}</div>
    <div class="sub">${sub||""}</div>${extra||""}</div>`;
}

function lineSeries(variant,navArr,highlight,label){
  return {name:nameOf(variant,label),type:"line",data:navArr,showSymbol:false,
    lineStyle:{width:highlight?2.6:1.3,color:colorOf(variant)},itemStyle:{color:colorOf(variant)}};
}
function baseOpt(navArrs,legend=true){
  const dates=navArrs.length?navArrs[0].data.map(x=>x[0]):[];
  return {
    animation:false,textStyle:{fontFamily:"inherit"},
    tooltip:{trigger:"axis",backgroundColor:"#1a2030",borderColor:"#232a3b",textStyle:{color:"#d7dce6",fontSize:12},
      valueFormatter:v=>v==null?"–":Number(v).toFixed(4)},
    legend:legend?{textStyle:{color:"#8a93a6",fontSize:11},top:0}:undefined,
    grid:{left:56,right:20,top:legend?34:16,bottom:48},
    xAxis:{type:"category",data:dates,axisLine:{lineStyle:{color:"#232a3b"}},axisLabel:{color:"#8a93a6"}},
    yAxis:{type:"value",scale:true,axisLabel:{color:"#8a93a6"},splitLine:{lineStyle:{color:"#1a2030"}}},
    dataZoom:[{type:"inside"},{type:"slider",height:16,bottom:8,borderColor:"#232a3b",backgroundColor:"#131722",
      fillerColor:"rgba(76,141,255,.15)",textStyle:{color:"#8a93a6"}}]
  };
}

function metricsTable(rows,keys,labels){
  let h=`<table><tr><th>策略</th>${labels.map(l=>`<th>${l}</th>`).join("")}</tr>`;
  for(const r of rows){
    h+=`<tr><td style="color:${colorOf(r.v)}">${nameOf(r.v,r.label)}</td>`+
      keys.map(k=>{
        const val=r.m[k];let cls="";
        if(k==="total_return"||k==="annual_return")cls=val>=0?"pos":"neg";
        if(k==="max_drawdown")cls="neg";
        if(k==="ic_mean"||k==="sharpe")cls=val>0?"pos":"neg";
        const txt=(k==="total_return"||k==="annual_return"||k==="max_drawdown"||k==="weekly_win_rate"||k==="ic_pos")?fmtPct(val):fmtNum(val);
        return `<td class="${cls}">${txt}</td>`;
      }).join("")+`</tr>`;
  }
  return h+"</table>";
}

async function main(){
  const [summary,portfolio]=await Promise.all([jload("data/summary.json"),jload("data/portfolio.json")]);
  const mkts={};for(const k of ["cn","us","crypto","gold"]){try{mkts[k]=await jload(`data/${k}.json`)}catch(e){}}
  for(const k in mkts){UNI[k]=(mkts[k].instruments||[])}
  document.getElementById("app").innerHTML=render(summary,portfolio,mkts);
  window.__data={summary,portfolio,mkts};
  drawCharts(summary,portfolio,mkts);
}

function render(S,P,M){
  const pm=P.metrics||{};
  const wr=pm.weekly||{},st=pm.static||{},bh=pm.buyhold||{},ms=pm.static;
  const gains=S.weekly_vs_static_gain||{};
  const nPos=Object.entries(gains).filter(([k,v])=>k!=="portfolio"&&v.return_delta>0).length;
  const nMkt=Object.keys(gains).filter(k=>k!=="portfolio").length;
  const portGain=(gains.portfolio||{}).return_delta;
  let verdict;
  if(portGain!=null&&portGain>0){
    verdict=`✅ <b>结论:支持</b> — 在 ${nMkt} 个市场中有 <b>${nPos}</b> 个市场"每周再训练"优于"年初一次训练",四市场等权组合收益差 <b class="pos">${fmtPct(portGain)}</b>。更频繁地用最新数据重训模型,总体上提高了 2026 年以来的收益与 IC 稳定性。`;
  }else if(portGain!=null){
    verdict=`⚠️ <b>结论:部分支持</b> — ${nPos}/${nMkt} 个市场周度再训练占优,但组合层面收益差 ${fmtPct(portGain)} 为负。再训练频率的收益因市场而异,并非无条件有效。`;
  }else{verdict="结果生成中…";}

  let kpis = kpiCard("买入持有(基准)",bh.total_return,`夏普 ${fmtNum(bh.sharpe)} · 回撤 ${fmtPct(bh.max_drawdown)}`)
    + kpiCard("静态模型·年初训练一次",st.total_return,`夏普 ${fmtNum(st.sharpe)} · 回撤 ${fmtPct(st.max_drawdown)}`)
    + kpiCard("每周再训练模型",wr.total_return,`夏普 ${fmtNum(wr.sharpe)} · 回撤 ${fmtPct(wr.max_drawdown)}`)
    + kpiCard("周度再训练增益",((wr.total_return??0)-(st.total_return??0)),`相对静态模型 · 2026年初至今`);

  let gainRows=`<table><tr><th>市场</th><th>周度 − 静态 收益差</th><th>夏普差</th><th>IC 差</th></tr>`;
  for(const [k,v] of Object.entries(gains)){
    gainRows+=`<tr><td>${v.name}</td><td class="${v.return_delta>=0?"pos":"neg"}">${fmtPct(v.return_delta)}</td>
      <td class="${(v.sharpe_delta??0)>=0?"pos":"neg"}">${v.sharpe_delta==null?"–":(v.sharpe_delta>0?"+":"")+v.sharpe_delta}</td>
      <td class="${(v.ic_delta??0)>=0?"pos":"neg"}">${v.ic_delta==null?"–":fmtNum(v.ic_delta,4)}</td></tr>`;
  }
  gainRows+="</table>";

  const tabs=Object.entries(M).map(([k,v],i)=>`<div class="tab ${i===0?"on":""}" data-mkt="${k}">${v.name}</div>`).join("");

  return `
  <header>
    <h1>OpenTrade <span class="accent">·</span> 开源量化模型四市场实盘模拟</h1>
    <div class="subtitle">基于 Microsoft Qlib(Alpha158 因子 + LightGBM / GRU)· 2026-01-01 → ${S.backtest_range?S.backtest_range[1]:""} 每周调仓 walk-forward 回测 · 检验"每周重新训练模型"能否提高收益 · 实验代号 alpha2026</div>
    <div class="chips">
      <span class="chip">市场 <b>A股沪深300 · 美股标普500 · 币安Top15 · 黄金资产14标的</b></span>
      <span class="chip">引擎 <b>Qlib 0.9.7 · Alpha158 · LightGBM</b></span>
      <span class="chip">算力 <b>RTX 3060 · WSL2</b></span>
      <span class="chip">数据 <b>腾讯/新浪/上金所/币安 免费公开接口</b></span>
      <span class="chip">生成于 <b>${S.generated_at}</b></span>
      <span class="chip">🔄 <b>每周一 08:30 自动重跑</b>(自托管 Actions runner · RTX 3060)</span>
      <span class="chip"><a href="https://github.com/Holidayrabbit/OpenTrade" target="_blank">GitHub 仓库 ↗</a></span>
    </div>
  </header>

  <h2>四市场等权组合 · 2026 年初至今</h2>
  <div class="cards">${kpis}</div>
  <div style="height:14px"></div>
  <div class="panel"><div id="chart-portfolio" class="chart"></div></div>

  <h2>实验结论 · 每周调整模型 vs 不调整</h2>
  <div class="verdict">${verdict}</div>
  <div class="panel">${gainRows}</div>

  <h2>分市场详情</h2>
  <div class="tabs" id="mtabs">${tabs}</div>
  <div class="panel"><div id="chart-market" class="chart"></div></div>
  <div style="height:14px"></div>
  <div class="grid2">
    <div class="panel"><div class="label" style="color:var(--muted);font-size:12px;margin-bottom:8px">绩效指标 · 全部策略对比</div><div id="m-metrics"></div></div>
    <div class="panel"><div class="label" style="color:var(--muted);font-size:12px;margin-bottom:8px">预测力 IC(逐日 RankIC, 20日均值)</div><div id="chart-ic" class="chart-sm"></div></div>
  </div>
  <div style="height:14px"></div>
  <div class="panel"><div class="label" style="color:var(--muted);font-size:12px;margin-bottom:8px">最新一期调仓(周度再训练 · 绿=新买入 红=调出 · 持仓为 Top-K 等权)</div><div class="holdings" id="m-holdings"></div></div>

  <h2>实验详情 · 这个模拟是怎么做的</h2>
  <div class="panel method">
    <p><b>① 数据准备:</b>从四个免费公开数据源抓取 2017-01 至今的日线行情(开盘/最高/最低/收盘/成交量),共 832 个标的。A 股与美股使用前复权价格(消除分红除权造成的价格跳变),加密货币为 7×24 连续行情,四个市场各自维护独立交易日历。</p>
    <table style="margin:6px 0 10px">
      <tr><th>市场</th><th>标的池</th><th>数量</th><th>数据源</th></tr>
      <tr><td>A股</td><td>沪深300 成分股(按当前名单回溯)</td><td>300</td><td>腾讯行情 fqkline</td></tr>
      <tr><td>美股</td><td>标普500 成分股 + smartbox 代码映射</td><td>503</td><td>腾讯 usfqkline</td></tr>
      <tr><td>加密</td><td>币安 USDT 24h 成交额 Top15(上市早于 2024-06)</td><td>15</td><td>data-api.binance.vision</td></tr>
      <tr><td>黄金</td><td>伦敦金XAU·COMEX期金·上金所Au99.99·黄金ETF·金矿股(跨4类)</td><td>14</td><td>新浪/东财/上金所(akshare)/腾讯</td></tr>
    </table>
    <p><b>② 特征与标签:</b>每个交易日、每个标的计算 <b>Alpha158</b>(Qlib 官方因子集:158 个价量技术指标,如动量、波动率、量价背离、K线形态等)。标签为 <b>T+1 收盘 → T+2 收盘的收益率</b>(与 Qlib 官方基准一致)。特征归一化的统计量冻结在 2017–2023 区间,保证不泄露未来信息。</p>
    <p><b>③ 模型训练(六档难度梯度):</b>① <b>线性回归 OLS</b>——最笨基准,检验复杂模型是否真有增益;② <b>Ridge 回归</b>——同款线性模型加 L2 正则(α=10);③ <b>LightGBM</b>——梯度提升树(官方 CSI300 调参),主力模型;④ <b>MLP</b>——256 隐层前馈网络(GPU);⑤ <b>GRU</b>——门控循环网络(GPU);⑥ <b>ALSTM</b>——注意力机制 LSTM(GPU)。训练窗口为"数据起点 → 调仓日前两天",窗口末 15% 作验证集早停(线性模型无早停)。</p>
    <p><b>④ 模拟交易(每个调仓周循环):</b>T 日(每周首个交易日)收盘后计算特征 → 模型给全部标的打分 → 取 Top-K(A股/美股 K=8,加密/黄金 K=5)→ 以 T 日收盘价调仓为等权组合 → 扣除交易成本。连续 5 个交易日无行情的持仓按最后已知价强制平仓(处理退市/停牌)。全程无任何未来数据流入。</p>
    <table style="margin:6px 0 10px">
      <tr><th>市场</th><th>买入成本</th><th>卖出成本</th><th>说明</th></tr>
      <tr><td>A股</td><td>0.08%</td><td>0.13%</td><td>佣金+冲击 / 佣金+印花税+冲击</td></tr>
      <tr><td>美股</td><td>0.05%</td><td>0.05%</td><td>佣金+冲击</td></tr>
      <tr><td>加密</td><td>0.10%</td><td>0.10%</td><td>taker 费率</td></tr>
      <tr><td>黄金</td><td>0.05%</td><td>0.05%</td><td>按 ETF/股票口径近似</td></tr>
    </table>
    <p><b>⑤ 四个对照变体(唯一差异 = 模型更新频率):</b></p>
    <table style="margin:6px 0 10px">
      <tr><th>变体</th><th>重训频率</th><th>含义</th></tr>
      <tr><td>static 静态</td><td>仅 2026 年初一次(数据截至 2025-12-31)</td><td>传统"年度模型"</td></tr>
      <tr><td>monthly 每月</td><td>每月首个交易日</td><td>中频更新</td></tr>
      <tr><td>weekly 每周</td><td>每周首个交易日(共 43 次重训)</td><td><b>核心假设:模型新鲜度</b></td></tr>
      <tr><td>buyhold 买入持有</td><td>不训练,年初等权买入持有</td><td>基准线</td></tr>
    </table>
    <p><b>⑥ 指标口径:</b>总收益 = 期末净值−1(已含全部成本);夏普按各自市场年化天数计算;最大回撤 = 净值曲线从峰值的最大跌幅;<b>IC(信息系数)</b>= 每天模型分数与真实次日涨幅的秩相关系数,衡量"预测能力本身",IC&gt;0 且稳定为正说明模型选股有效——注意 IC 好不代表组合赚钱(还要看市场环境与交易成本)。</p>
    <p><b>⑥′ 策略构建复杂度实验(strat_* 变体):</b>在<b>完全相同</b>的每周 LightGBM 信号上对比 6 种组合构建方法——<b>base</b>:Top-K 等权一把梭(基准);<b>dropout</b>:持仓跌出前 2K 才卖出、空位从头部补(降换手省成本);<b>riskparity</b>:Top-K 内按 60 日波动率倒数加权(单票≤35%);<b>voltarget</b>:按策略已实现波动率动态调总仓位(目标年化 20%,高波自动减仓);<b>timing</b>:市场等权指数收于 30 周均线上方才持仓、否则持币;<b>combo</b>:dropout 选股+风险平价加权+min(波动率目标,趋势择时) 仓位全叠。检验:在 alpha 不变的前提下,组合构建层的复杂度值多少收益?</p>
    <p><b>⑦ 一键复现:</b>任何 Linux/WSL 机器上 <code>bash deploy/setup_env.sh &amp;&amp; nohup bash run_all.sh &amp;</code> 即可从抓数据到生成本页全套结果(约 2–4 小时,详见 <a href="https://github.com/Holidayrabbit/OpenTrade" target="_blank">GitHub 仓库 README</a>)。</p>
  </div>

  <h2>方法与调研</h2>
  <div class="panel method">

function drawCharts(S,P,M){
  const VARORDER=["buyhold","static","linear_static","ridge_static","monthly","gru_static","alstm_static","mlp_static","weekly","linear_weekly","strat_base","strat_dropout","strat_riskparity","strat_voltarget","strat_timing","strat_combo"];
  const c1=echarts.init(document.getElementById("chart-portfolio"));
  const variants=VARORDER.filter(v=>(P.variants||{})[v]);
  c1.setOption({...baseOpt(variants.map(v=>({data:(P.variants[v].nav)}))),
    series:variants.map(v=>lineSeries(v,(P.variants[v].nav),v==="weekly",P.variants[v].label))});

  function drawMarket(k){
    const m=M[k];if(!m)return;
    const vs=VARORDER.filter(v=>m.variants[v]);
    const cm=echarts.init(document.getElementById("chart-market"));
    cm.setOption({...baseOpt(vs.map(v=>({data:m.variants[v].nav}))),
      series:vs.map(v=>lineSeries(v,m.variants[v].nav,v==="weekly",m.variants[v].label))});
    const wk=m.variants.weekly||m.variants.static;
    const rows=vs.map(v=>({v,label:m.variants[v].label,m:{...m.variants[v].metrics,ic_mean:(m.variants[v].metrics.ic||{}).mean_ic,
      ic_pos:(m.variants[v].metrics.ic||{}).ic_positive_rate}}));
    document.getElementById("m-metrics").innerHTML=metricsTable(rows,
      ["total_return","annual_return","sharpe","max_drawdown","weekly_win_rate","ic_mean"],
      ["总收益","年化","夏普","最大回撤","周胜率","IC"]);
    const hasIC=vs.filter(v=>m.variants[v].ic_4w_ma);
    if(hasIC.length){
      const ci=echarts.init(document.getElementById("chart-ic"));
      const dates=m.variants[hasIC[0]].ic_4w_ma.map(x=>x[0]);
      ci.setOption({...baseOpt(hasIC.map(v=>({data:m.variants[v].ic_4w_ma}))),
        series:hasIC.map(v=>({name:nameOf(v,m.variants[v].label),type:"line",data:m.variants[v].ic_4w_ma,showSymbol:false,
          lineStyle:{width:v==="weekly"?2.4:1.2,color:colorOf(v)},itemStyle:{color:colorOf(v)}})),
        yAxis:{...baseOpt([]).yAxis,axisLabel:{color:"#8a93a6",formatter:v=>v.toFixed(2)}}});
    }
    const tr=(m.variants.weekly?.recent_trades||[]).filter(t=>t.date).slice(-1)[0];
    let holdHtml="";
    if(tr){
      holdHtml+=(tr.bought||[]).map(i=>`<span class="hchip" style="border-color:rgba(0,214,143,.45);color:var(--green)">▲ ${instName(k,i)}</span>`).join("");
      holdHtml+=(tr.sold||[]).map(i=>`<span class="hchip" style="border-color:rgba(255,92,92,.4);color:var(--red)">▼ ${instName(k,i)}</span>`).join("");
    }
    document.getElementById("m-holdings").innerHTML=holdHtml||"<span style='color:var(--muted)'>–</span>";
  }
  const keys=Object.keys(M);
  let cur=keys.includes(qs.get("m"))?qs.get("m"):keys[0];
  drawMarket(cur);
  document.getElementById("mtabs").addEventListener("click",e=>{
    const t=e.target.closest(".tab");if(!t)return;
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");cur=t.dataset.mkt;history.replaceState({},"",`?m=${cur}`);drawMarket(cur);
  });
  window.addEventListener("resize",()=>{echarts.dispose;document.querySelectorAll("[_echarts_instance_]").forEach(el=>echarts.getInstanceByDom(el)&&echarts.getInstanceByDom(el).resize())});
}

</script>
